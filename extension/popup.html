<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PriceWise AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      min-height: 200px;
      max-height: 600px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
      background: #fff;
      overflow-y: auto;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #3B82F6, #4F46E5);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: white;
      font-weight: 700;
      font-size: 15px;
    }
    .header .logo span { font-size: 20px; }
    .header .subtitle {
      color: rgba(255,255,255,0.75);
      font-size: 10px;
    }

    /* Spinner */
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid #e5e7eb;
      border-top-color: #3B82F6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Utility classes (subset of Tailwind inline) */
    .flex { display: flex; }
    .flex-col { flex-direction: column; }
    .flex-1 { flex: 1; }
    .items-center { align-items: center; }
    .justify-center { justify-content: center; }
    .justify-between { justify-content: space-between; }
    .text-center { text-align: center; }
    .text-right { text-align: right; }
    .space-y-3 > * + * { margin-top: 12px; }
    .space-y-1 > * + * { margin-top: 4px; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .p-2 { padding: 8px; }
    .p-3 { padding: 12px; }
    .px-4 { padding-left: 16px; padding-right: 16px; }
    .py-1 { padding-top: 4px; padding-bottom: 4px; }
    .py-1\.5 { padding-top: 6px; padding-bottom: 6px; }
    .pt-1 { padding-top: 4px; }
    .mt-0\.5 { margin-top: 2px; }
    .mt-1 { margin-top: 4px; }
    .mb-1 { margin-bottom: 4px; }
    .h-48 { height: 192px; }
    .h-1\.5 { height: 6px; }
    .w-full { width: 100%; }
    .font-medium { font-weight: 500; }
    .font-semibold { font-weight: 600; }
    .font-bold { font-weight: 700; }
    .text-xs { font-size: 12px; line-height: 16px; }
    .text-sm { font-size: 14px; line-height: 20px; }
    .text-lg { font-size: 18px; line-height: 28px; }
    .text-4xl { font-size: 36px; line-height: 40px; }
    .text-gray-400 { color: #9ca3af; }
    .text-gray-500 { color: #6b7280; }
    .text-gray-600 { color: #4b5563; }
    .text-gray-700 { color: #374151; }
    .text-gray-800 { color: #1f2937; }
    .text-blue-600 { color: #2563eb; }
    .text-emerald-600 { color: #059669; }
    .text-emerald-700 { color: #047857; }
    .text-emerald-800 { color: #065f46; }
    .text-white { color: #fff; }
    .bg-emerald-50 { background: #ecfdf5; }
    .bg-gray-200 { background: #e5e7eb; }
    .bg-blue-600 { background: #2563eb; }
    .bg-white { background: #fff; }
    .border { border: 1px solid #e5e7eb; }
    .border-b { border-bottom: 1px solid #e5e7eb; }
    .border-gray-100 { border-color: #f3f4f6; }
    .border-gray-300 { border-color: #d1d5db; }
    .border-emerald-200 { border-color: #a7f3d0; }
    .rounded-lg { border-radius: 8px; }
    .rounded-md { border-radius: 6px; }
    .rounded-full { border-radius: 9999px; }
    .leading-snug { line-height: 1.375; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .uppercase { text-transform: uppercase; }
    .tracking-wide { letter-spacing: 0.05em; }
    .last\:border-0:last-child { border: 0; }
    a { text-decoration: none; cursor: pointer; }
    a:hover { text-decoration: underline; }
    button { cursor: pointer; font-family: inherit; font-size: inherit; }
    .transition-colors { transition: background-color 0.15s, color 0.15s; }
    .hover\:bg-blue-700:hover { background: #1d4ed8; }
    .hover\:bg-gray-50:hover { background: #f9fafb; }
    .hover\:underline:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <span>💰</span> PriceWise AI
    </div>
    <div class="subtitle">Smart Shopping Intelligence</div>
  </div>

  <div id="app"></div>

  <script src="dist/popup.js"></script>
</body>
</html>
